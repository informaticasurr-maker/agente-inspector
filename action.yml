name: 'Agente Inspector de Código'
description: 'Auditoría automática de seguridad, detección de secretos, análisis de calidad y recomendaciones con IA'
author: 'informaticasurr-maker'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'Directorio o ruta a inspeccionar'
    required: false
    default: '.'
  fail-on:
    description: 'Nivel mínimo de severidad para fallar el build (CRITICAL, HIGH, MEDIUM, LOW, NONE)'
    required: false
    default: 'HIGH'
  enable-ai:
    description: 'Habilitar análisis semántico profundo con Gemini API (true/false)'
    required: false
    default: 'false'
  gemini-api-key:
    description: 'API Key de Gemini si enable-ai es true'
    required: false
    default: ''
  sarif:
    description: 'Generar reporte SARIF para la pestaña de seguridad de GitHub'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del Agente Inspector
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install rich pyyaml google-genai

    - name: Ejecutar Agente Inspector
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
      run: |
        EXTRA_ARGS=""
        if [ "${{ inputs.enable-ai }}" = "true" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --ai"
        fi
        if [ "${{ inputs.sarif }}" = "true" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --sarif"
        fi

        python -m inspector.cli scan ${{ inputs.target }} --fail-on ${{ inputs.fail-on }} $EXTRA_ARGS

    - name: Publicar Resumen en GitHub Actions
      shell: bash
      if: always()
      run: |
        if [ -f INSPECTION_REPORT.md ]; then
          cat INSPECTION_REPORT.md >> $GITHUB_STEP_SUMMARY
        fi
