[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-inspector-agent"
version = "1.0.0"
description = "Agente Inspector de Código y Seguridad para repositorios locales y GitHub Actions"
authors = [{ name = "informaticasurr-maker" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "google-genai>=0.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
inspector = "inspector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inspector*"]
